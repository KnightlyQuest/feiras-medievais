<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏰 Feiras Medievais Portugal 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap');
        
        :root { --medieval-gold: #d4af77; }
        
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .medieval-title { 
            font-family: 'UnifrakturCook', cursive; 
            text-shadow: 3px 3px 0 #000; 
        }
        
        .card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover {
            transform: translateY(-4px) scale(1.03);
        }
        
        .modal {
            animation: modalPop 0.3s ease-out forwards;
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.95) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Filtros não ficam sticky no mobile */
        #filters {
            position: relative;
            z-index: 10;
        }

        /* Melhoria de toque no mobile */
        button, select, input {
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-[#1a1208] text-amber-100 min-h-screen">

    <!-- HEADER (mantém sticky) -->
    <header class="bg-[#2c1f12] border-b-4 border-[#d4af77] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-[#d4af77] text-[#2c1f12] rounded-2xl flex items-center justify-center text-3xl shadow-inner">🏰</div>
                <div>
                    <h1 id="headerTitle" class="medieval-title text-3xl tracking-wider text-[#d4af77]">FEIRAS MEDIEVAIS</h1>
                    <p id="headerSubtitle" class="text-amber-200 text-xs -mt-1">Portugal • 2026</p>
                </div>
            </div>

            <div class="flex items-center gap-2 bg-[#1a1208] px-3 py-1.5 rounded-3xl border border-[#d4af77]/30">
                <button onclick="changeLanguage('pt')" id="btnPT" 
                        class="px-5 py-2 rounded-2xl font-medium text-sm flex items-center gap-2 bg-[#d4af77] text-[#2c1f12]">🇵🇹 Português</button>
                <button onclick="changeLanguage('en')" id="btnEN" 
                        class="px-5 py-2 rounded-2xl font-medium text-sm flex items-center gap-2">🇬🇧 English</button>
            </div>
        </div>
    </header>

    <!-- HERO -->
    <div class="bg-[radial-gradient(at_bottom_right,#3c2a1f_0%,#1a1208_70%)] py-10 border-b-4 border-[#d4af77]">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <h2 id="heroTitle" class="medieval-title text-5xl md:text-6xl leading-none">Feiras Medievais<br>em Portugal</h2>
        </div>
    </div>

    <!-- FILTROS (agora rola com o conteúdo) -->
    <div id="filters" class="max-w-7xl mx-auto px-6 py-6 bg-[#2c1f12]">
        <div class="flex flex-col md:flex-row gap-4 items-end">
            <div class="flex-1">
                <label id="searchLabel" class="block text-xs uppercase tracking-widest mb-2 text-amber-300">🔎 Procurar</label>
                <div class="relative">
                    <input id="searchInput" type="text" placeholder="Ex: Óbidos, Viagem Medieval..." 
                           class="w-full bg-[#1a1208] border border-[#d4af77]/40 focus:border-[#d4af77] rounded-3xl px-6 py-4 text-base outline-none"
                           onkeyup="if(event.key==='Enter') applyFilters()">
                    <button onclick="applyFilters()" class="absolute right-3 top-1/2 -translate-y-1/2 bg-[#d4af77] text-[#2c1f12] px-6 py-2 rounded-3xl">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>

            <div class="w-full md:w-52">
                <label id="monthLabel" class="block text-xs uppercase tracking-widest mb-2 text-amber-300">📅 Mês</label>
                <select id="monthSelect" onchange="applyFilters()" 
                        class="w-full bg-[#1a1208] border border-[#d4af77]/40 focus:border-[#d4af77] rounded-3xl px-6 py-4 outline-none">
                    <option value="">Todos os meses</option>
                </select>
            </div>

            <div class="w-full md:w-56">
                <label id="regionLabel" class="block text-xs uppercase tracking-widest mb-2 text-amber-300">🗺️ Região</label>
                <select id="regionSelect" onchange="applyFilters()" 
                        class="w-full bg-[#1a1208] border border-[#d4af77]/40 focus:border-[#d4af77] rounded-3xl px-6 py-4 outline-none">
                    <option value="">Todas as regiões</option>
                </select>
            </div>

            <button onclick="resetFilters()" id="clearBtn" 
                    class="px-8 py-4 bg-transparent border border-[#d4af77]/50 hover:border-[#d4af77] rounded-3xl text-sm uppercase tracking-widest whitespace-nowrap">LIMPAR</button>
        </div>
    </div>

    <!-- LISTA DE EVENTOS -->
    <div class="max-w-7xl mx-auto px-6 pb-12 mobile-safe">
        <div class="flex justify-between items-center mb-8">
            <h3 id="listTitle" class="text-3xl medieval-title">Feiras Medievais</h3>
            <div id="countBadge" class="bg-[#d4af77] text-[#2c1f12] px-6 py-2 rounded-3xl text-sm font-medium">0 resultados</div>
        </div>

        <div id="eventsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- MODAL MAIS INFO -->
    <div id="infoModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4">
        <div class="modal bg-[#2c1f12] border-4 border-[#d4af77] rounded-3xl max-w-lg w-full overflow-hidden">
            <div class="bg-gradient-to-r from-[#d4af77] to-amber-600 px-6 py-4 flex justify-between items-center text-[#2c1f12]">
                <h3 id="modalTitle" class="text-2xl font-medium"></h3>
                <button onclick="closeModal()" class="text-3xl leading-none">×</button>
            </div>
            <div class="p-6 space-y-6">
                <div>
                    <span id="modalDatesLabel" class="text-xs uppercase tracking-widest text-amber-300">Datas</span>
                    <p id="modalDates" class="text-xl font-semibold"></p>
                </div>
                <div>
                    <span id="modalLocationLabel" class="text-xs uppercase tracking-widest text-amber-300">Local</span>
                    <p id="modalLocation" class="text-lg"></p>
                </div>
                <div>
                    <span id="modalRegionLabel" class="text-xs uppercase tracking-widest text-amber-300">Região</span>
                    <p id="modalRegion" class="inline-block px-5 py-1 bg-[#1a1208] rounded-3xl"></p>
                </div>
                <div>
                    <span id="modalDescLabel" class="text-xs uppercase tracking-widest text-amber-300">Descrição</span>
                    <p id="modalDesc" class="text-amber-200 leading-relaxed"></p>
                </div>

                <div class="flex flex-col gap-3 pt-4 border-t border-[#d4af77]/30">
                    <a id="modalOfficialLink" href="#" target="_blank" class="flex items-center justify-center gap-2 bg-[#d4af77] hover:bg-amber-300 text-[#2c1f12] py-4 rounded-3xl font-medium">
                        <i class="fas fa-external-link-alt"></i> Site Oficial
                    </a>
                    <a id="modalMapsLink" href="#" target="_blank" class="flex items-center justify-center gap-2 bg-[#1a1208] border border-[#d4af77]/50 hover:border-[#d4af77] py-4 rounded-3xl font-medium">
                        <i class="fas fa-map-marker-alt"></i> Ver no Google Maps
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const JSON_URL = "https://raw.githubusercontent.com/KnightlyQuest/feiras-medievais/main/data/events-2026.json";

        let eventsData = [];
        let currentLang = 'pt';

        const translations = {
            pt: {
                headerTitle: "FEIRAS MEDIEVAIS",
                headerSubtitle: "Portugal • 2026",
                heroTitle: "Feiras Medievais em Portugal",
                searchLabel: "🔎 Procurar",
                monthLabel: "📅 Mês",
                regionLabel: "🗺️ Região",
                clearBtn: "LIMPAR",
                listTitle: "Feiras Medievais",
                modalDatesLabel: "Datas",
                modalLocationLabel: "Local",
                modalRegionLabel: "Região",
                modalDescLabel: "Descrição",
                moreInfo: "MAIS INFO"
            },
            en: {
                headerTitle: "MEDIEVAL FAIRS",
                headerSubtitle: "Portugal • 2026",
                heroTitle: "Medieval Fairs in Portugal",
                searchLabel: "🔎 Search",
                monthLabel: "📅 Month",
                regionLabel: "🗺️ Region",
                clearBtn: "CLEAR",
                listTitle: "Medieval Fairs",
                modalDatesLabel: "Dates",
                modalLocationLabel: "Location",
                modalRegionLabel: "Region",
                modalDescLabel: "Description",
                moreInfo: "MORE INFO"
            }
        };

        async function loadEvents() {
            try {
                const res = await fetch(JSON_URL + '?t=' + new Date().toISOString().split('T')[0]);
                eventsData = await res.json();
            } catch (e) {
                console.error("Erro ao carregar JSON", e);
            }
            populateFilters();
            renderEvents(eventsData);
        }

        function populateFilters() {
            const months = [...new Set(eventsData.map(e => e.month))].sort();
            const monthSelect = document.getElementById('monthSelect');
            monthSelect.innerHTML = '<option value="">Todos os meses</option>';
            months.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                monthSelect.appendChild(opt);
            });

            const regions = [...new Set(eventsData.map(e => e.region))].sort();
            const regionSelect = document.getElementById('regionSelect');
            regionSelect.innerHTML = '<option value="">Todas as regiões</option>';
            regions.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r;
                opt.textContent = r;
                regionSelect.appendChild(opt);
            });
        }

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            document.getElementById('btnPT').classList.toggle('bg-[#d4af77]', lang === 'pt');
            document.getElementById('btnPT').classList.toggle('text-[#2c1f12]', lang === 'pt');
            document.getElementById('btnEN').classList.toggle('bg-[#d4af77]', lang === 'en');
            document.getElementById('btnEN').classList.toggle('text-[#2c1f12]', lang === 'en');

            document.getElementById('headerTitle').textContent = t.headerTitle;
            document.getElementById('headerSubtitle').textContent = t.headerSubtitle;
            document.getElementById('heroTitle').textContent = t.heroTitle;
            document.getElementById('searchLabel').textContent = t.searchLabel;
            document.getElementById('monthLabel').textContent = t.monthLabel;
            document.getElementById('regionLabel').textContent = t.regionLabel;
            document.getElementById('clearBtn').textContent = t.clearBtn;
            document.getElementById('listTitle').textContent = t.listTitle;

            renderEvents(eventsData);
        }

        function showMoreInfo(event) {
            document.getElementById('modalTitle').textContent = event.name;
            document.getElementById('modalDates').textContent = event.dates;
            document.getElementById('modalLocation').textContent = event.location;
            document.getElementById('modalRegion').innerHTML = `<span class="px-4 py-1 bg-[#d4af77] text-[#2c1f12] rounded-3xl">${event.region}</span>`;
            document.getElementById('modalDesc').textContent = event.desc;

            const official = document.getElementById('modalOfficialLink');
            if (event.link && event.link.trim() !== '') {
                official.href = event.link;
                official.style.display = 'flex';
            } else {
                official.style.display = 'none';
            }

            const maps = document.getElementById('modalMapsLink');
            maps.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(event.location)}`;

            document.getElementById('infoModal').classList.remove('hidden');
            document.getElementById('infoModal').classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('infoModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function renderEvents(filtered) {
            const grid = document.getElementById('eventsGrid');
            grid.innerHTML = '';

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-3 text-center py-12 text-amber-200">Nenhuma feira encontrada</div>`;
                document.getElementById('countBadge').textContent = `0 resultados`;
                return;
            }

            filtered.forEach(event => {
                const html = `
                    <div class="card bg-[#2c1f12] border border-[#d4af77]/30 rounded-3xl p-6">
                        <div class="flex justify-between items-start">
                            <h4 class="text-xl font-medium text-[#d4af77]">${event.name}</h4>
                            <span class="text-xs px-3 py-1 bg-[#1a1208] rounded-full border border-[#d4af77]/30">${event.month}</span>
                        </div>
                        <p class="mt-3 text-amber-100">${event.dates}</p>
                        <p class="text-amber-300 text-sm mt-1">${event.location}</p>
                        <p class="mt-4 text-sm text-amber-200 line-clamp-3">${event.desc}</p>
                        <button onclick='showMoreInfo(${JSON.stringify(event)})' 
                                class="mt-6 w-full bg-[#d4af77] hover:bg-amber-300 text-[#2c1f12] py-3 rounded-3xl font-medium flex items-center justify-center gap-2">
                            <i class="fas fa-info-circle"></i> ${currentLang === 'pt' ? 'MAIS INFO' : 'MORE INFO'}
                        </button>
                    </div>`;
                grid.innerHTML += html;
            });

            document.getElementById('countBadge').textContent = `${filtered.length} resultados`;
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const month = document.getElementById('monthSelect').value;
            const region = document.getElementById('regionSelect').value;

            const filtered = eventsData.filter(e => {
                const matchSearch = !search || 
                    e.name.toLowerCase().includes(search) || 
                    e.location.toLowerCase().includes(search) ||
                    e.desc.toLowerCase().includes(search);
                const matchMonth = !month || e.month === month;
                const matchRegion = !region || e.region === region;
                return matchSearch && matchMonth && matchRegion;
            });

            renderEvents(filtered);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('monthSelect').value = '';
            document.getElementById('regionSelect').value = '';
            renderEvents(eventsData);
        }

        // Inicializar
        window.onload = () => {
            loadEvents();
            changeLanguage('pt');
        };
    </script>
</body>
</html>
