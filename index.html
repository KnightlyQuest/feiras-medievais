<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏰 Feiras Medievais Portugal 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap');
        :root { --medieval-gold: #d4af77; }
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .medieval-title { font-family: 'UnifrakturCook', cursive; text-shadow: 3px 3px 0 #000; }
        .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .past-event { opacity: 0.65; filter: grayscale(30%); }
        .past-badge { background-color: #4b5563; color: #d1d5db; }
    </style>
</head>
<body class="bg-[#1a1208] text-amber-100 min-h-screen">

    <!-- HEADER -->
    <header class="bg-[#2c1f12] border-b-4 border-[#d4af77] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-[#d4af77] text-[#2c1f12] rounded-2xl flex items-center justify-center text-3xl shadow-inner">🏰</div>
                <div>
                    <h1 id="headerTitle" class="medieval-title text-3xl tracking-wider text-[#d4af77]">FEIRAS MEDIEVAIS</h1>
                    <p id="headerSubtitle" class="text-amber-200 text-xs -mt-1">Portugal • 2026</p>
                </div>
            </div>

            <div class="flex items-center gap-2 bg-[#1a1208] px-3 py-1.5 rounded-3xl border border-[#d4af77]/30">
                <button onclick="changeLanguage('pt')" id="btnPT" 
                        class="px-5 py-2 rounded-2xl font-medium text-sm flex items-center gap-2 bg-[#d4af77] text-[#2c1f12]">🇵🇹 Português</button>
                <button onclick="changeLanguage('en')" id="btnEN" 
                        class="px-5 py-2 rounded-2xl font-medium text-sm flex items-center gap-2">🇬🇧 English</button>
            </div>
        </div>
    </header>

    <!-- HERO -->
    <div class="bg-[radial-gradient(at_bottom_right,#3c2a1f_0%,#1a1208_70%)] py-10 border-b-4 border-[#d4af77]">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <h2 id="heroTitle" class="medieval-title text-5xl md:text-6xl leading-none">Feiras Medievais<br>em Portugal</h2>
        </div>
    </div>

    <!-- FILTROS -->
    <div id="filters" class="max-w-7xl mx-auto px-6 py-6 bg-[#2c1f12]">
        <div class="flex flex-col md:flex-row gap-4 items-end">
            <div class="flex-1">
                <label id="searchLabel" class="block text-xs uppercase tracking-widest mb-2 text-amber-300">🔎 Procurar</label>
                <div class="relative">
                    <input id="searchInput" type="text" placeholder="Ex: Óbidos, Viagem Medieval..." 
                           class="w-full bg-[#1a1208] border border-[#d4af77]/40 focus:border-[#d4af77] rounded-3xl px-6 py-4 text-base outline-none"
                           onkeyup="if(event.key==='Enter') applyFilters()">
                    <button onclick="applyFilters()" class="absolute right-3 top-1/2 -translate-y-1/2 bg-[#d4af77] text-[#2c1f12] px-6 py-2 rounded-3xl">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>

            <div class="w-full md:w-52">
                <label id="monthLabel" class="block text-xs uppercase tracking-widest mb-2 text-amber-300">📅 Mês</label>
                <select id="monthSelect" onchange="applyFilters()" class="w-full bg-[#1a1208] border border-[#d4af77]/40 focus:border-[#d4af77] rounded-3xl px-6 py-4 outline-none">
                    <option value="">Todos os meses</option>
                </select>
            </div>

            <div class="w-full md:w-56">
                <label id="regionLabel" class="block text-xs uppercase tracking-widest mb-2 text-amber-300">🗺️ Região</label>
                <select id="regionSelect" onchange="applyFilters()" class="w-full bg-[#1a1208] border border-[#d4af77]/40 focus:border-[#d4af77] rounded-3xl px-6 py-4 outline-none">
                    <option value="">Todas as regiões</option>
                </select>
            </div>

            <button onclick="resetFilters()" id="clearBtn" 
                    class="px-8 py-4 bg-transparent border border-[#d4af77]/50 hover:border-[#d4af77] rounded-3xl text-sm uppercase tracking-widest">LIMPAR</button>
        </div>
    </div>

    <!-- LISTA -->
    <div class="max-w-7xl mx-auto px-6 pb-12">
        <div class="flex justify-between items-center mb-8">
            <h3 id="listTitle" class="text-3xl medieval-title">Feiras Medievais</h3>
            <div id="countBadge" class="bg-[#d4af77] text-[#2c1f12] px-6 py-2 rounded-3xl text-sm font-medium">0 resultados</div>
        </div>
        <div id="eventsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- MODAL -->
    <div id="infoModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[9999] p-4">
        <div class="modal bg-[#2c1f12] border-4 border-[#d4af77] rounded-3xl max-w-lg w-full overflow-hidden">
            <div class="bg-gradient-to-r from-[#d4af77] to-amber-600 px-6 py-4 flex justify-between items-center text-[#2c1f12]">
                <h3 id="modalTitle" class="text-2xl font-medium"></h3>
                <button onclick="closeModal()" class="text-3xl leading-none">×</button>
            </div>
            <div class="p-6 space-y-6">
                <div>
                    <span id="modalDatesLabel" class="text-xs uppercase tracking-widest text-amber-300">Datas</span>
                    <p id="modalDates" class="text-xl font-semibold"></p>
                </div>
                <div>
                    <span id="modalLocationLabel" class="text-xs uppercase tracking-widest text-amber-300">Local</span>
                    <p id="modalLocation" class="text-lg"></p>
                </div>
                <div>
                    <span id="modalRegionLabel" class="text-xs uppercase tracking-widest text-amber-300">Região</span>
                    <p id="modalRegion" class="inline-block px-5 py-1 bg-[#1a1208] rounded-3xl"></p>
                </div>
                <div>
                    <span id="modalDescLabel" class="text-xs uppercase tracking-widest text-amber-300">Descrição</span>
                    <p id="modalDesc" class="text-amber-200 leading-relaxed"></p>
                </div>

                <div class="flex flex-col gap-3 pt-4 border-t border-[#d4af77]/30">
                    <a id="modalOfficialLink" href="#" target="_blank" class="flex items-center justify-center gap-2 bg-[#d4af77] hover:bg-amber-300 text-[#2c1f12] py-4 rounded-3xl font-medium">
                        <i class="fas fa-external-link-alt"></i> Site Oficial
                    </a>
                    <a id="modalMapsLink" href="#" target="_blank" class="flex items-center justify-center gap-2 bg-[#1a1208] border border-[#d4af77]/50 hover:border-[#d4af77] py-4 rounded-3xl font-medium">
                        <i class="fas fa-map-marker-alt"></i> Ver no Google Maps
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const JSON_URL = "https://raw.githubusercontent.com/KnightlyQuest/feiras-medievais/main/data/events-2026.json";

        let eventsData = [];
        let currentLang = 'pt';

        const monthMap = {
            "janeiro": 1, "fevereiro": 2, "março": 3, "abril": 4, "maio": 5, "junho": 6,
            "julho": 7, "agosto": 8, "setembro": 9, "outubro": 10, "novembro": 11, "dezembro": 12
        };

        const monthMapEn = {
            "january": 1, "february": 2, "march": 3, "april": 4, "may": 5, "june": 6,
            "july": 7, "august": 8, "september": 9, "october": 10, "november": 11, "december": 12
        };

        function parseMonthNameToNumber(name) {
            if (!name) return null;
            const lower = name.toLowerCase().trim();
            return monthMap[lower] || monthMap[lower.replace('ç', 'c')] || monthMapEn[lower] || null;
        }

        function parseEventDate(datesStr) {
            if (!datesStr || typeof datesStr !== 'string') return new Date(2099, 0, 1);
            const s = datesStr.trim();

            // ISO date support: 2026-05-08 or 2026-05-08 -> 2026-05-10
            let m = s.match(/(20\d{2})-(\d{2})-(\d{2})/);
            if (m) return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));

            // PT format: 10 a 12 de Abril 2026 / 10 de Abril 2026
            m = s.match(/(\d{1,2})\s*(?:a|e|-)?\s*(\d{1,2})?\s*de\s*([a-zçãõáéíóúâêô]+)\s*,?\s*(\d{4})/i);
            if (m) {
                const day = parseInt(m[1]);
                const month = parseMonthNameToNumber(m[3]) || 1;
                const year = parseInt(m[4]);
                return new Date(year, month - 1, day);
            }

            // English range: From the 14th to the 17th of August (2026)
            m = s.match(/from\s+the\s+(\d{1,2})(?:st|nd|rd|th)?\s+to\s+the\s+(\d{1,2})(?:st|nd|rd|th)?\s+of\s+([a-z]+)(?:\s*\(?(\d{4})\)?)?/i);
            if (m) {
                const day = parseInt(m[1]);
                const month = parseMonthNameToNumber(m[3]) || 1;
                const year = m[4] ? parseInt(m[4]) : 2026;
                return new Date(year, month - 1, day);
            }

            // English cross-month range: From the 29th of July to the 9th of August (2026)
            m = s.match(/from\s+the\s+(\d{1,2})(?:st|nd|rd|th)?\s+of\s+([a-z]+)\s+to\s+the\s+(\d{1,2})(?:st|nd|rd|th)?\s+of\s+([a-z]+)(?:\s*\(?(\d{4})\)?)?/i);
            if (m) {
                const day = parseInt(m[1]);
                const month = parseMonthNameToNumber(m[2]) || 1;
                const year = m[5] ? parseInt(m[5]) : 2026;
                return new Date(year, month - 1, day);
            }

            // English split-day format: April 25th and 26th (2026)
            m = s.match(/([a-z]+)\s+(\d{1,2})(?:st|nd|rd|th)?\s+(?:and|to|-)\s+(\d{1,2})(?:st|nd|rd|th)?(?:\s*\(?(\d{4})\)?)?/i);
            if (m) {
                const month = parseMonthNameToNumber(m[1]) || 1;
                const day = parseInt(m[2]);
                const year = m[4] ? parseInt(m[4]) : 2026;
                return new Date(year, month - 1, day);
            }

            // Month-year fallback: Abril 2026 / August 2026
            m = s.match(/([a-zçãõáéíóúâêô]+)\s*,?\s*(20\d{2})/i);
            if (m) {
                const month = parseMonthNameToNumber(m[1]);
                if (month) return new Date(parseInt(m[2]), month - 1, 1);
            }

            // Year fallback: 2026
            m = s.match(/\b(20\d{2})\b/);
            if (m) return new Date(parseInt(m[1]), 0, 1);

            return new Date(2099, 0, 1);
        }

        function isPastEvent(datesStr) {
            const raw = (datesStr || '').trim();
            const lower = raw.toLowerCase();

            if (
                lower.includes('datas a confirmar') ||
                lower.includes('dates to be confirmed') ||
                /^\d{4}$/.test(raw)
            ) {
                return false;
            }
            const eventDate = parseEventDate(raw);
            return eventDate < new Date();
        }

        async function loadEvents() {
            try {
                const res = await fetch(JSON_URL + '?t=' + Date.now());
                eventsData = await res.json();
                // Sort chronologically
                eventsData.sort((a, b) => parseEventDate(a.dates) - parseEventDate(b.dates));
            } catch (e) {
                console.error("Erro ao carregar JSON", e);
            }
            populateFilters();
            renderEvents(eventsData);
        }

        function populateFilters() {
            const monthOrder = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", 
                                "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro", "2026"];
        
            const uniqueMonths = [...new Set(eventsData.map(e => (e.month || '').trim()).filter(Boolean))];
            
            // Sort months according to natural calendar order
            uniqueMonths.sort((a, b) => {
                const indexA = monthOrder.indexOf(a);
                const indexB = monthOrder.indexOf(b);
                if (indexA === -1) return 1;
                if (indexB === -1) return -1;
                return indexA - indexB;
            });
        
            const monthSelect = document.getElementById('monthSelect');
            monthSelect.innerHTML = '<option value="">Todos os meses</option>';
            
            uniqueMonths.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                monthSelect.appendChild(opt);
            });
        }

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang] || translations.pt;

            document.getElementById('btnPT').classList.toggle('bg-[#d4af77]', lang === 'pt');
            document.getElementById('btnPT').classList.toggle('text-[#2c1f12]', lang === 'pt');
            document.getElementById('btnEN').classList.toggle('bg-[#d4af77]', lang === 'en');
            document.getElementById('btnEN').classList.toggle('text-[#2c1f12]', lang === 'en');

            document.getElementById('headerTitle').textContent = t.headerTitle;
            document.getElementById('headerSubtitle').textContent = t.headerSubtitle;
            document.getElementById('heroTitle').textContent = t.heroTitle;
            document.getElementById('searchLabel').textContent = t.searchLabel;
            document.getElementById('monthLabel').textContent = t.monthLabel;
            document.getElementById('regionLabel').textContent = t.regionLabel;
            document.getElementById('clearBtn').textContent = t.clearBtn;
            document.getElementById('listTitle').textContent = t.listTitle;

            renderEvents(eventsData);
        }

        const translations = {
            pt: { headerTitle: "FEIRAS MEDIEVAIS", headerSubtitle: "Portugal • 2026", heroTitle: "Feiras Medievais em Portugal",
                  searchLabel: "🔎 Procurar", monthLabel: "📅 Mês", regionLabel: "🗺️ Região", clearBtn: "LIMPAR",
                  listTitle: "Feiras Medievais", modalDatesLabel: "Datas", modalLocationLabel: "Local",
                  modalRegionLabel: "Região", modalDescLabel: "Descrição", moreInfo: "MAIS INFO" },
            en: { headerTitle: "MEDIEVAL FAIRS", headerSubtitle: "Portugal • 2026", heroTitle: "Medieval Fairs in Portugal",
                  searchLabel: "🔎 Search", monthLabel: "📅 Month", regionLabel: "🗺️ Region", clearBtn: "CLEAR",
                  listTitle: "Medieval Fairs", modalDatesLabel: "Dates", modalLocationLabel: "Location",
                  modalRegionLabel: "Region", modalDescLabel: "Description", moreInfo: "MORE INFO" }
        };

        function showMoreInfo(event) {
            document.getElementById('modalTitle').textContent = event.name;
            document.getElementById('modalDates').textContent = event.dates;
            document.getElementById('modalLocation').textContent = event.location;
            document.getElementById('modalRegion').innerHTML = `<span class="px-4 py-1 bg-[#d4af77] text-[#2c1f12] rounded-3xl">${event.region}</span>`;
            document.getElementById('modalDesc').textContent = event.desc || "Sem descrição disponível.";

            const official = document.getElementById('modalOfficialLink');
            official.href = event.link || "#";
            official.style.display = event.link ? 'flex' : 'none';

            const maps = document.getElementById('modalMapsLink');
            maps.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(event.maps_query || event.location)}`;

            document.getElementById('infoModal').classList.remove('hidden');
            document.getElementById('infoModal').classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('infoModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function renderEvents(filtered) {
            const grid = document.getElementById('eventsGrid');
            grid.innerHTML = '';

            filtered.forEach(event => {
                const isPast = isPastEvent(event.dates);
                const cardHTML = `
                    <div class="card bg-[#2c1f12] border border-[#d4af77]/30 rounded-3xl p-6 ${isPast ? 'past-event' : ''}">
                        <div class="flex justify-between items-start">
                            <h4 class="text-xl font-medium ${isPast ? 'text-gray-400' : 'text-[#d4af77]'}">${event.name}</h4>
                            ${isPast 
                                ? `<span class="past-badge text-xs px-3 py-1 rounded-full">Já aconteceu</span>` 
                                : `<span class="text-xs px-3 py-1 bg-[#1a1208] rounded-full border border-[#d4af77]/30">${event.month}</span>`}
                        </div>
                        <p class="mt-3 ${isPast ? 'text-gray-400' : 'text-amber-100'}">${event.dates}</p>
                        <p class="text-amber-300 text-sm mt-1">${event.location}</p>
                        <p class="mt-4 text-sm text-amber-200 line-clamp-3">${event.desc || ''}</p>
                        <button onclick='showMoreInfo(${JSON.stringify(event)})' 
                                class="mt-6 w-full ${isPast ? 'bg-gray-600' : 'bg-[#d4af77] hover:bg-amber-300'} text-[#2c1f12] py-3 rounded-3xl font-medium flex items-center justify-center gap-2">
                            <i class="fas fa-info-circle"></i> MAIS INFO
                        </button>
                    </div>`;
                grid.innerHTML += cardHTML;
            });

            document.getElementById('countBadge').textContent = `${filtered.length} resultados`;
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const month = document.getElementById('monthSelect').value;
            const region = document.getElementById('regionSelect').value;

            const filtered = eventsData.filter(e => {
                const matchSearch = !search || 
                    e.name.toLowerCase().includes(search) || 
                    e.location.toLowerCase().includes(search) ||
                    (e.desc && e.desc.toLowerCase().includes(search));
                const matchMonth = !month || e.month === month;
                const matchRegion = !region || e.region === region;
                return matchSearch && matchMonth && matchRegion;
            });

            renderEvents(filtered);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('monthSelect').value = '';
            document.getElementById('regionSelect').value = '';
            renderEvents(eventsData);
        }

        window.onload = () => {
            loadEvents();
            changeLanguage('pt');
        };
    </script>
</body>
</html>
